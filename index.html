<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecția 3: Corpuri cerești în Univers</title>
    <style>
        :root {
            --primary: #1a202c;
            --border-color: #cbd5e0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --correct-bg: #c6f6d5;
            --correct-color: #22543d;
            --error-bg: #fed7d7;
            --error-color: #742a2a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #2d3748;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            margin-top: 0;
            color: #1a202c;
        }
        h2 {
            font-size: 1.1rem;
            color: #2d3748;
            margin-top: 25px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .bold-title {
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2b6cb0;
        }
        .exercise-section {
            margin-bottom: 35px;
        }
        .celestial-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .celestial-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

            border-radius: 6px;
            border: 1px solid #334155;
        }
        
        /* Clasele pentru pozițiile inițiale din imaginea completă */
        .crop-1 { background-position: 0% 0%; }
        .crop-2 { background-position: 50% 0%; }
        .crop-3 { background-position: 100% 0%; }
        .crop-4 { background-position: 0% 50%; }
        .crop-5 { background-position: 50% 50%; }
        .crop-6 { background-position: 100% 50%; }
        .crop-7 { background-position: 0% 100%; }
        .crop-8 { background-position: 50% 100%; }
        .crop-9 { background-position: 100% 100%; }
        
        .celestial-select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            color: #2d3748;
            font-weight: 600;
            font-size: 0.95rem;
            box-sizing: border-box;
            cursor: pointer;
            outline: none;
        }
        .item-correct { background-color: var(--correct-bg) !important; color: var(--correct-color) !important; border-color: #48bb78 !important; }
        .item-error { background-color: var(--error-bg) !important; color: var(--error-color) !important; border-color: #f56565 !important; }
        .btn-submit { display: block; width: 100%; padding: 14px; background-color: #2d3748; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .btn-submit:hover { background-color: #1a202c; }
        .feedback { margin-top: 15px; padding: 12px; border-radius: 4px; display: none; font-weight: bold; text-align: center; }
    </style>

<body>
<div class="container">
    <h1>Lecția 3: Corpuri cerești în Univers</h1>
    <div class="bold-title">Identifică componentele Cosmosului pe baza imaginilor din fișă!</div>
    <!-- EXERCITIUL I -->
    <div class="exercise-section">
        <h2>Privește cu atenție imaginile de mai jos (afișate în ordine aleatorie) și selectează pentru fiecare corp ceresc denumirea sa corectă din lista derulantă:</h2>
        
        <!-- Această grilă va fi umplută automat și aleatoriu de către codul din Bucata 4 -->
        <div class="celestial-grid" id="dynamic-grid"></div>
    </div>

    <button class="btn-submit" onclick="validateL3Exercise()">Verifică și evaluează imaginile</button>
    <div id="l3-feedback" class="feedback"></div>
</div>
<!-- Șablon ascuns folosit de script pentru a genera listele derulante fără a repeta codul -->
<template id="select-template">
    <select class="celestial-select">
        <option value="">-- Selectează --</option>
        <option value="asteroid">Asteroid</option>
        <option value="gaura-neagra">Gaură neagră</option>
        <option value="nebuloasa">Nebuloasă</option>
        <option value="meteoriti">Meteoriți / Stele căzătoare</option>
        <option value="cometa">Cometă</option>
        <option value="galaxie">Galaxie</option>
        <option value="satelit-natural">Satelit natural (Luna)</option>
        <option value="satelit-artificial">Satelit artificial</option>
        <option value="soare">Stea (Soarele)</option>
    </select>
</template>
<script>
    // Definim cele 9 elemente cu decupajul CSS corespunzător și răspunsul corect din spate
    const celestialItems = [
        { cropClass: 'crop-1', correctValue: 'asteroid' },
        { cropClass: 'crop-2', correctValue: 'gaura-neagra' },
        { cropClass: 'crop-3', correctValue: 'nebuloasa' },
        { cropClass: 'crop-4', correctValue: 'meteoriti' },
        { cropClass: 'crop-5', correctValue: 'cometa' },
        { cropClass: 'crop-6', correctValue: 'galaxie' },
        { cropClass: 'crop-7', correctValue: 'satelit-natural' },
        { cropClass: 'crop-8', correctValue: 'satelit-artificial' },
        { cropClass: 'crop-9', correctValue: 'soare' }
    ];

    // Funcție de amestecare aleatorie (Algoritmul Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Generăm elementele în pagină la încărcare în mod complet aleatoriu
    window.addEventListener('DOMContentLoaded', () => {
        const shuffledItems = shuffleArray([...celestialItems]);
        const gridContainer = document.getElementById('dynamic-grid');
        const template = document.getElementById('select-template').content;

        shuffledItems.forEach((item, index) => {
            // Cream structura cardului
            const card = document.createElement('div');
            card.className = 'celestial-card';

            // Adăugăm div-ul pentru imagine cu decupajul aferent
            const imgDiv = document.createElement('div');
            imgDiv.className = `universe-sprite ${item.cropClass}`;
            card.appendChild(imgDiv);

            // Clonăm lista derulantă din șablon și îi injectăm răspunsul corect ascuns
            const selectClone = template.cloneNode(true);
            const selectElement = selectClone.querySelector('select');
            selectElement.setAttribute('data-correct', item.correctValue);
            selectElement.id = `select-item-${index}`;
            
            card.appendChild(selectClone);
            gridContainer.appendChild(card);
        });
    });

    // Funcția de verificare a răspunsurilor selectate de elev
    function validateL3Exercise() {
        let correctCount = 0;
        const totalImages = 9;

        // Resetăm stilurile de feedback vizual anterioare
        document.querySelectorAll('.celestial-select').forEach(select => {
            select.classList.remove('item-correct', 'item-error');
        });

        // Verificăm selecțiile elevului
        document.querySelectorAll('.celestial-select').forEach(select => {
            const userChoice = select.value;
            const correctChoice = select.getAttribute('data-correct');

            if (userChoice === correctChoice && userChoice !== "") {
                select.classList.add('item-correct');
                correctCount++;
            } else {
                select.classList.add('item-error');
            }
        });

        // Afișare raport banner final global
        const fb = document.getElementById('l3-feedback');
        fb.style.display = 'block';

        if (correctCount === totalImages) {
            fb.style.backgroundColor = '#c6f6d5';
            fb.style.color = '#22543d';
            fb.innerText = `Excelent! Toate cele ${totalImages} imagini din univers.jpg au fost corect identificate!`;
        } else if (correctCount >= 5) {
            fb.style.backgroundColor = '#feebc8';
            fb.style.color = '#744210';
            fb.innerText = `Destul de bine! Ai identificat corect ${correctCount} din ${totalImages} corpuri. Corectează listele marcate cu roșu!`;
        } else {
            fb.style.backgroundColor = '#fed7d7';
            fb.style.color = '#742a2a';
            fb.innerText = `Identificarea conține erori. Ai doar ${correctCount} răspunsuri corecte. Reanalizează elementele cu roșu!`;
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
</body>
</html>
